# ⚠️ 已弃用 / 仅供参考：此文件不会被任何服务加载。
# Consumer 二进制实际读取统一配置 configs/server.yaml（默认路径），
# 容器化部署见 deploy/config/server.yaml。此处仅保留字段 schema 供参考，请勿直接照抄运行。
#
# mxcwpp Consumer 配置 (P1-5)

http_addr: ":8081"
analysis_enabled: false        # 走 Engine 微服务时此项为 false
consumer_group: "mxcwpp-consumer"
batch_size: 500
batch_timeout: "5s"

database:
  dsn: ""
  max_open_conns: 50
  max_idle_conns: 10

redis:
  addr: "localhost:6379"

kafka:
  brokers: []                  # 必填

clickhouse:
  addr: "localhost:9000"
  database: mxcwpp

otel:
  enabled: false
  sample_rate: 0.1

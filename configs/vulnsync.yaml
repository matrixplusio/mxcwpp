# mxcwpp VulnSync 配置
#
# VulnSync 只从这个文件读取 kafka 段（未用 --kafka-brokers 指定时），其余配置都走命令行参数：
#   --http :8083                健康检查与指标端口
#   --redis-addr <host:port>    启用主备选举；留空则单实例运行
#   --kafka-brokers a:9092,b    Kafka 地址，优先于本文件的 kafka 段
#   --advisory-topic <topic>    公告推送的 topic，默认 mxcwpp.vuln.advisory
#   --sources rhsa,usn          启用的公告源，留空启用全部。代码里登记的源：
#                               rhsa / rocky-apollo / usn / debian-tracker / alpine / centos /
#                               openeuler-sa / anolis-ansa / kylin-sa / uos-sa
# 各公告源的同步间隔目前写在代码里（4 到 6 小时）。

kafka:
  enabled: true
  brokers: []

name: mxcwpp

# 单机部署 compose 文件（独立，不依赖其他 compose 文件）
# 用 deploy/deploy.sh 启动：它负责生成密钥与证书、渲染配置，并按 .env 的 *_REPLICAS 设置副本数。
# 数据库与消息队列的宿主机端口只绑本机；对外只开放控制台（HTTP_PORT/HTTPS_PORT）与 Agent 接入（GRPC_PORT）。
# 不写死 container_name：容器名由 compose 按项目名生成，同一台机器上的多套环境才能共存。

services:
  # ==================== 基础设施 ====================
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mxcwpp}
      MYSQL_USER: ${MYSQL_USER:-mxcwpp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./config/mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ${DATA_DIR:-./data}/logs/mysql:/var/log/mysql
    healthcheck:
      # 走 TCP（127.0.0.1）而不是 socket（localhost）：首次初始化时镜像会先起一个只开 socket 的临时实例，
      # socket 检查会提前判健康，依赖它的服务随即连 TCP 被拒、崩溃重启。
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mxcwpp-net
    deploy:
      resources:
        limits:
          memory: 4G

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      sh -c '
        if [ -n "$REDIS_PASSWORD" ]; then
          redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
        else
          redis-server --appendonly yes
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mxcwpp-net

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    restart: always
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 6
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR:-./data}/kafka-1:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mxcwpp-net

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    restart: always
    ports:
      - "127.0.0.1:9094:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 6
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR:-./data}/kafka-2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mxcwpp-net

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    restart: always
    ports:
      - "127.0.0.1:9095:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 6
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR:-./data}/kafka-3:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mxcwpp-net

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: always
    cap_add:
      - SYS_NICE
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-mxcwpp}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR:-./data}/clickhouse:/var/lib/clickhouse
      - ./init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./config/clickhouse.xml:/etc/clickhouse-server/config.d/custom.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mxcwpp-net
    deploy:
      resources:
        limits:
          memory: 8G

  # ==================== 应用服务 ====================
  # Agent 接入入口：AgentCenter 可多副本，不能各自映射同一个宿主端口，统一由四层代理转发。
  ac-proxy:
    image: haproxy:2.8-alpine
    restart: always
    depends_on:
      - agentcenter
    ports:
      - "${GRPC_PORT:-6751}:6751"
    volumes:
      - ./config/haproxy-agentcenter.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - mxcwpp-net

  agentcenter:
    image: ${IMAGE_REGISTRY:-ghcr.io/matrixplusio}/mxcwpp-agentcenter:${VERSION:-1.0.0}
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
    volumes:
      - ./config/server.yaml:/etc/mxcwpp/server.yaml:ro
      - ./certs:/etc/mxcwpp/certs:ro
      - ${DATA_DIR:-./data}/logs/agentcenter:/var/log/mxcwpp
      - ${DATA_DIR:-./data}/plugins:/opt/mxcwpp/plugins
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mxcwpp-net
    deploy:
      resources:
        limits:
          memory: 4G

  manager:
    image: ${IMAGE_REGISTRY:-ghcr.io/matrixplusio}/mxcwpp-manager:${VERSION:-1.0.0}
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - ./config/server.yaml:/etc/mxcwpp/server.yaml:ro
      - ./certs:/etc/mxcwpp/certs:ro
      - ${DATA_DIR:-./data}/logs/manager:/var/log/mxcwpp
      - ${DATA_DIR:-./data}/plugins:/opt/mxcwpp/plugins:ro
      - ${DATA_DIR:-./data}/uploads:/opt/mxcwpp/uploads
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mxcwpp-net
    deploy:
      resources:
        limits:
          memory: 4G

  consumer:
    image: ${IMAGE_REGISTRY:-ghcr.io/matrixplusio}/mxcwpp-consumer:${VERSION:-1.0.0}
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
    volumes:
      - ./config/server.yaml:/etc/mxcwpp/server.yaml:ro
      - ${DATA_DIR:-./data}/logs/consumer:/var/log/mxcwpp
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mxcwpp-net
    deploy:
      resources:
        limits:
          memory: 2G

  # ===== Engine 检测引擎 =====
  # 官方单机拓扑此前缺失 engine/vulnsync/llmproxy/gotenberg 四个服务：
  # deploy.sh 一键装出来的系统没有检测引擎（不产告警）、没有漏洞同步（库不更新）、
  # 没有 PDF 渲染（报告导出坏）。装起来"能跑"，但核心能力都不在。
  engine:
    image: ${IMAGE_REGISTRY:-ghcr.io/matrixplusio}/mxcwpp-engine:${VERSION:-1.0.0}
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
    volumes:
      - ./config/server.yaml:/etc/mxcwpp/server.yaml:ro
      - ${DATA_DIR:-./data}/logs/engine:/var/log/mxcwpp
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8082/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - mxcwpp-net
    deploy:
      resources:
        limits:
          memory: 2G

  # ===== VulnSync 漏洞库同步 =====
  vulnsync:
    image: ${IMAGE_REGISTRY:-ghcr.io/matrixplusio}/mxcwpp-vulnsync:${VERSION:-1.0.0}
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mysql:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
    volumes:
      - ./config/server.yaml:/etc/mxcwpp/server.yaml:ro
      - ${DATA_DIR:-./data}/logs/vulnsync:/var/log/mxcwpp
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8083/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - mxcwpp-net
    deploy:
      resources:
        limits:
          memory: 2G

  # ===== LLMProxy 多 LLM 厂商适配网关 =====
  llmproxy:
    image: ${IMAGE_REGISTRY:-ghcr.io/matrixplusio}/mxcwpp-llmproxy:${VERSION:-1.0.0}
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./config/server.yaml:/etc/mxcwpp/server.yaml:ro
      - ${DATA_DIR:-./data}/logs/llmproxy:/var/log/mxcwpp
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8085/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mxcwpp-net
    deploy:
      resources:
        limits:
          memory: 1G

  # ===== Gotenberg PDF 渲染 =====
  # 报告导出依赖它；缺失时导出的是损坏的 .pdf 而非报错，属静默失败。
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    command:
      - "gotenberg"
      - "--api-port=3000"
      - "--chromium-disable-web-security"
      - "--chromium-allow-list=.*"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mxcwpp-net
    deploy:
      resources:
        limits:
          memory: 1G

  # ===== Prometheus 监控 =====
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - ${DATA_DIR:-./data}/prometheus:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mxcwpp-net
    deploy:
      resources:
        limits:
          memory: 1G

  ui:
    image: ${IMAGE_REGISTRY:-ghcr.io/matrixplusio}/mxcwpp-ui:${VERSION:-1.0.0}
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      manager:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx 443 读 /etc/nginx/ssl/server.{crt,key}；deploy.sh 只把服务端证书对同步到
      # ./certs/ssl。绝不挂整个 ./certs：其中含 CA 私钥 / client.key / enroll_token.secret。
      - ./certs/ssl:/etc/nginx/ssl:ro
      - ${DATA_DIR:-./data}/logs/nginx:/var/log/nginx
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mxcwpp-net

networks:
  mxcwpp-net:
    driver: bridge

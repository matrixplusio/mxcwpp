# AgentCenter 多实例前置转发（四层 TCP 直通，mTLS 在 AC 上终结）。
#
# 用途：agent 连接地址是编译期写死的，入口必须留在原地址上；本配置占用该地址。
# 主备模式：平时全部连接给主 AC（AC1），备 AC（AC2）待命不接连接；主 AC 排空或宕掉时
# /ready 不通，新连接才落到备 AC。升级流程见 scripts/ac-rolling-upgrade.sh。
#
# 环境变量：
#   AC_FRONTEND   入口监听地址，即 agent 编译进去的地址，如 10.0.0.10:6751
#   AC1_HOST      主 AC 地址（与入口同机时用 127.0.0.1，AC 的 grpc.host 也设为 127.0.0.1）
#   AC2_HOST      备 AC 地址
#   AC_GRPC_PORT  AC gRPC 端口（默认部署为 6751）
#   AC_HTTP_PORT  AC 管理端口（默认部署为 8081），/ready 在这里
#
# 注意：经本转发进入的连接在 AC 看来都来自转发层地址，不要同时开启 AC 的按 IP 限流
# （server.grpc.anti_dos 中按 IP 的项），否则全部 agent 会共用一个限流桶。

global
    log stdout format raw local0
    maxconn 20000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    # 长连接：agent 每个心跳周期都有数据，留足余量，避免转发层先于 AC 判空闲断流
    timeout client 10m
    timeout server 10m

frontend fe_agentcenter
    bind "${AC_FRONTEND}"
    default_backend be_agentcenter

backend be_agentcenter
    balance first
    # 就绪检查：排空中的 AC 返回 503，4 秒内被摘除，不再分到新连接；已有连接由 AC 自己分批断开
    option httpchk GET /ready
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    server ac1 "${AC1_HOST}:${AC_GRPC_PORT}" check port "${AC_HTTP_PORT}"
    # backup：主 AC 就绪时一条连接都不给它。主 AC 恢复后，已在备 AC 上的连接不会自动回去
    # （不用 on-marked-up shutdown-backup-sessions：它会一次性断掉全部连接，等于全网同时重连），
    # 由升级脚本排空备 AC 分批切回。
    server ac2 "${AC2_HOST}:${AC_GRPC_PORT}" check port "${AC_HTTP_PORT}" backup

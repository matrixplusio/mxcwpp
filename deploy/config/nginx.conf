# Manager 多实例负载均衡
# 单实例时只需一条 server，多实例时追加更多 server 行
# docker compose up --scale manager=2 后，Docker DNS 自动将 manager 解析到多个容器
upstream mxcwpp-manager {
    least_conn;
    server manager:8080;
    # 多实例时 Docker 内部 DNS 轮询解析，least_conn 在同一 IP 时退化为轮询
    keepalive 32;
}

# HTTP(80)：仅承载容器健康探测（限本机/容器网络），其余一律 301 跳转 HTTPS。
# 绝不在此明文端口上承载 UI/API，也不发送 HSTS（HSTS 只在 HTTPS 响应中有效/安全）。
server {
    listen 80;
    server_name _;

    # 容器编排健康检查：仅允许本机/容器网络访问，返回纯文本 ok，不代理任何 UI/API。
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;   # docker 默认桥接网段
        allow 10.0.0.0/8;      # 集群内网
        deny all;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Agent 插件包下载：agent 出厂配置 plugins.base_url 默认走明文 80。此路径只回传
    # 插件二进制，不承载凭据/会话，且 agent 端强制校验 SHA256 + ed25519 签名，明文传输
    # 无法被注入。若此处也 301 到私有 CA 的 HTTPS，全量 agent 会因不信任 CA 而下载失败。
    location /api/v1/plugins/download {
        proxy_pass http://mxcwpp-manager;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # 其余全部强制跳转 HTTPS。
    location / {
        return 301 https://$host$request_uri;
    }

    server_tokens off;
}

# HTTPS(443)：官方入口，承载 UI + API + Agent 下载。
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传文件大小限制（Agent 安装包等）
    client_max_body_size 500M;

    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /api {
        proxy_pass http://mxcwpp-manager;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /agent {
        proxy_pass http://mxcwpp-manager;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    location / {
        # Next.js static export (trailingSlash:false) 产出扁平 login.html/dashboard.html，
        # 必须先试 $uri.html，否则刷新 /login 等路由会回退到 /index.html（根重定向到
        # /dashboard），未登录即白屏。
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全响应头。HSTS 只在 HTTPS 入口发送。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
    server_tokens off;
}

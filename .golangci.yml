version: "2"
linters:
  enable:
    - forbidigo
    - misspell
  settings:
    staticcheck:
      # 排除 QF（quickfix）类：staticcheck 官方定位是「编辑器里的交互式重构建议」，
      # 例如「这串 if-else 可以写成 switch」「这里能用德摩根律」。
      # 它们不指示缺陷，把它们当门禁只会让人为了过 CI 去改无关代码，
      # 顺手改坏的风险高于收益。SA（缺陷）/S（化简）/ST（约定）保持开启。
      checks:
        - all
        - -QF*
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(ln|f)?$
        - pattern: ^log\.(Print|Println|Printf)$
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # 镜像内核 ABI 的类型与常量沿用内核里的写法：eBPF C 结构体逐字段对应 Go struct，
      # fanotify 常量抄自 <linux/fanotify.h>。改成 Go 驼峰会让两边对不上，
      # 日后核对字段偏移或搜内核头文件都要多绕一层，收益抵不过代价。
      - linters:
          - staticcheck
        path: internal/agent/edr/(collector|fanotify|npatch)/
        text: ST1003
      - linters:
          - forbidigo
        path: ^cmd/
      - linters:
          - forbidigo
        path: ^internal/deploy/cluster/
      - linters:
          - forbidigo
        path: ^internal/agent/updater/
      - linters:
          - errcheck
          - forbidigo
        path: _test\.go$
    paths:
      - deploy/data
      - deploy/data-perf
      - dist
      - tmp
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
